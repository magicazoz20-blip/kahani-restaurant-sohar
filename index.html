 go("New order / طلب جديد\n"+k.map(c=>{tot+=c.p*c.q;return`• ${c.n} x${c.q} = ${f(c.p*c.q)} OMR`}).join("\n")+`\nTotal: ${f(tot)} OMR\nName: ${$("on").value}\nPhone: ${$("op").value}\nNotes: ${$("oq").value}\n(Prices pending confirmation)`)};
$("rsend").onclick=()=>{if(!$("rn").value||!$("rp").value||!$("rd").value)return alert(t("Please fill name, phone and date|يرجى تعبئة الاسم والهاتف والتاريخ"));
 go(`Reservation REQUEST (not confirmed) / طلب حجز أولي\nName: ${$("rn").value}\nPhone: ${$("rp").value}\nDate: ${$("rd").value} ${$("rt").value}\nGuests: ${$("rg").value}\nSeating: ${$("rs").value}\nNotes: ${$("rm").value}`)};
$("csend").onclick=()=>{if($("cm").value)go(`Message from ${$("cn").value}:\n${$("cm").value}`)};
render();
</script></body></html>
